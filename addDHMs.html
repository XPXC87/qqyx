<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六石禮包碼工具</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f7f9; display: flex; justify-content: center; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        h3 { margin-top: 0; text-align: center; }
        textarea { width: 100%; height: 250px; margin: 10px 0; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 18px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .footer { font-size: 12px; color: #888; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <h3>禮包碼保存系統</h3>
    <textarea id="codes" placeholder="正在同步雲端紀錄..." inputmode="latin"></textarea>
    <button onclick="submit()">提交並更新紀錄</button>
    <p class="footer">※ 資料已與雲端資料庫同步</p>
</div>

<script>
    const CLOUDFLARE_API = 'https://qqyx-api.xpxc.workers.dev'; 

    // 網頁開啟時，直接從 D1 資料庫讀取
    window.onload = async function() {
        const textarea = document.getElementById('codes');
        try {
            const response = await fetch(CLOUDFLARE_API);
            if (response.ok) {
                const dbCodes = await response.json();
                // 如果有資料，直接顯示在輸入框內
                if (dbCodes && dbCodes.length > 0) {
                    textarea.value = dbCodes.join('\n');
                }
            }
        } catch (error) {
    textarea.placeholder = "同步失敗：" + error.message; // 這樣能看到是網路斷了還是被擋了
}
    };

    async function submit() {
        const textarea = document.getElementById('codes');
        const lines = textarea.value.split('\n').map(s => s.trim()).filter(s => s !== "");
        
        if (lines.length === 0) return alert("請輸入禮包碼");

        // 1. 同步到 Cloudflare D1 紀錄內容
        for (const giftCode of lines) {
            fetch(CLOUDFLARE_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: giftCode })
            });
        }

        // 2. 執行原本不可變動的提交邏輯
        const joined = lines.join('@==');
        const url = `http://47.96.230.2:9997/qqyxNew/addDHM?dhm=${encodeURIComponent(joined)}`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
