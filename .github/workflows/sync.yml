name: 腳本自動同步

on:
  workflow_dispatch:

concurrency:
  group: qqyx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: 檢查
        uses: actions/checkout@v6


      # ============================================================
      # 2. 初始化 Python + Pip Cache
      # ============================================================
      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt


      # ============================================================
      # 3. 恢復 Chromium Cache
      # ============================================================
      - name: 恢復 Chromium Cache
        id: chromium-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-


      # ============================================================
      # 4. 顯示目前 Cache 狀態
      # ============================================================
      - name: 檢查 Cache
        run: |
          echo "========================================"
          echo "📦 Cache 狀態"
          echo "========================================"

          echo ""
          echo "Python / Pip Cache："
          python -m pip cache info || true

          echo ""
          echo "Chromium Cache："

          if [ -d ~/.cache/ms-playwright ]; then
            du -sh ~/.cache/ms-playwright || true

            echo ""
            echo "Chromium 目錄："
            find ~/.cache/ms-playwright -maxdepth 2 -type d || true
          else
            echo "⚠️ Chromium Cache 不存在"
          fi


      # ============================================================
      # 5. 安裝 Python 運行庫
      # ============================================================
      - name: 安裝運行庫
        run: |
          echo "========================================"
          echo "🐍 安裝 Python 運行庫"
          echo "========================================"

          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 6. 安裝 / 檢查 Chromium
      #
      # Playwright 會優先使用已存在的瀏覽器檔案。
      # 如果 Cache 沒有，就下載新的。
      # ============================================================
      - name: 安裝 Chromium
        run: |
          echo "========================================"
          echo "🌐 安裝 / 檢查 Chromium"
          echo "========================================"

          python -m playwright install --with-deps chromium


      # ============================================================
      # 7. 檢查 Chromium
      # ============================================================
      - name: 檢查 Chromium
        run: |
          echo "========================================"
          echo "🔍 Chromium 檢查"
          echo "========================================"

          if [ -d ~/.cache/ms-playwright ]; then
            echo "Chromium Cache："
            du -sh ~/.cache/ms-playwright || true

            echo ""
            echo "Chromium 檔案："
            find ~/.cache/ms-playwright -maxdepth 2 -type d || true
          else
            echo "❌ Chromium Cache 不存在"
            exit 1
          fi


      # ============================================================
      # 8. 保存 Chromium Cache
      # ============================================================
      - name: 保存 Chromium Cache
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}


      # ============================================================
      # 9. 執行前清理
      #
      # 注意：
      # 不清掉 Python Cache
      # 不清掉 Chromium Cache
      #
      # 只清理真正不需要的暫存與舊下載。
      # ============================================================
      - name: 執行前清理
        run: |
          echo "========================================"
          echo "🧹 執行前環境清理"
          echo "========================================"

          echo ""
          echo "📊 清理前記憶體："
          free -h

          echo ""
          echo "📊 清理前磁碟："
          df -h

          # 清理 APT 暫存
          sudo apt-get clean
          sudo apt-get autoclean

          # 清理系統暫存
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          # 清理舊下載
          rm -rf downloads
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.tmp
          rm -f *.part
          rm -f *.crdownload

          # 確保 filesystem buffers 寫入
          sync

          echo ""
          echo "📊 清理後記憶體："
          free -h

          echo ""
          echo "📊 清理後磁碟："
          df -h

          echo ""
          echo "✅ 執行前清理完成"
          echo "📦 Python Cache：保留"
          echo "🌐 Chromium Cache：保留"


      # ============================================================
      # 10. 執行前 Python GC
      # ============================================================
      - name: Python GC
        run: |
          echo "========================================"
          echo "🐍 Python Garbage Collection"
          echo "========================================"

          python - <<'PY'
          import gc

          collected = gc.collect()

          print(f"✅ Python GC 完成")
          print(f"♻️ 回收物件：{collected}")
          PY

          sync

          echo ""
          echo "📊 執行前記憶體："
          free -h


      # ============================================================
      # 11. 執行下載
      # ============================================================
      - name: 執行下載
        run: |
          echo "========================================"
          echo "🚀 開始執行 APK 同步"
          echo "========================================"

          python -u python/down.py


      # ============================================================
      # 12. 最終清理
      # ============================================================
      - name: 清理殘留 APK
        if: always()
        run: |
          echo "========================================"
          echo "🧹 Workflow 最終清理"
          echo "========================================"

          rm -rf downloads
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.crdownload
          rm -f *.part
          rm -f *.tmp

          sync

          echo ""
          echo "📊 最終記憶體："
          free -h

          echo ""
          echo "📊 最終磁碟："
          df -h

          echo ""
          echo "✅ Workflow 完成"
