name: 腳本自動同步

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:

      # ==================================================
      # 1. 取得程式碼
      # ==================================================
      - name: 檢查
        uses: actions/checkout@v6


      # ==================================================
      # 2. 初始化 Python + pip Cache
      # ==================================================
      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt


      # ==================================================
      # 3. 安裝 Python 套件
      # ==================================================
      - name: 安裝運行庫
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==================================================
      # 4. 恢復 Chromium Cache
      # ==================================================
      - name: 恢復 Chromium Cache
        id: chromium-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-


      # ==================================================
      # 5. 安裝 Chromium
      # ==================================================
      - name: 安裝 Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ==================================================
      # 6. 顯示 Chromium
      # ==================================================
      - name: 檢查 Chromium
        run: |
          echo "Chromium Cache 目錄："
          du -sh ~/.cache/ms-playwright || true

          echo ""
          echo "Chromium 檔案："
          find ~/.cache/ms-playwright -maxdepth 2 -type d || true


      # ==================================================
      # 7. 保存 Chromium Cache
      #    即使後面的 down.py 失敗也會保存
      # ==================================================
      - name: 保存 Chromium Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}


      # ==================================================
      # 8. 執行下載
      # ==================================================
      - name: 執行下載
        run: |
          python -u down.py


      # ==================================================
      # 9. 清理
      # ==================================================
      - name: 清理殘留APK
        if: always()
        run: |
          rm -rf downloads
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.crdownload
          rm -f *.part
