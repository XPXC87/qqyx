name: 腳本自動同步

on:
  workflow_dispatch: # 保留手動觸發
  schedule:
    # 提示：GitHub Actions 的定時任務在尖峰時間常有延遲
    - cron: "*/5 * * * *" 

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: 檢查
        uses: actions/checkout@v4 # 截至目前穩定生產版本建議先用 v4，若你要使用最新的 v6 請確保有對應需求

      - name: 初始化 Python
        uses: actions/setup-python@v5 # 穩定生產版本建議先用 v5
        with:
          python-version: "3.12"
          cache: 'pip' # 💡 新增：自動快取 pip 依賴，加速每次執行的速度，節省 Actions 額度

      - name: 安裝運行庫
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 安裝 Chromium
        run: |
          # 💡 建議只安裝 chromium 瀏覽器本身即可，不需要重複下載其他瀏覽器
          python -m playwright install chromium --with-deps

      - name: 執行下載
        run: |
          python down.py

      - name: 清理殘留檔案
        if: always() # 確保無論成功或失敗都會執行清理
        run: |
          # 💡 使用 -f 參數，就算檔案不存在也不會報錯導致工作流亮紅燈
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.crdownload
          rm -f *.part
