name: 腳本自動同步

on:
  workflow_dispatch:

concurrency:
  group: qqyx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: 檢查
        uses: actions/checkout@v6

      # ============================================================
      # 2. Python
      # ============================================================
      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ============================================================
      # 3. 系統環境清理
      # ============================================================
      - name: 清理系統快取與記憶體
        run: |
          echo "========================================"
          echo "🧹 開始清理系統環境"
          echo "========================================"

          echo ""
          echo "📊 清理前記憶體："
          free -h

          echo ""
          echo "📊 清理前磁碟："
          df -h

          # --------------------------------------------------------
          # 清理 APT 快取
          # --------------------------------------------------------
          sudo apt-get clean
          sudo apt-get autoclean

          # --------------------------------------------------------
          # 清理暫存檔
          # --------------------------------------------------------
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          # --------------------------------------------------------
          # 清理 pip cache
          # --------------------------------------------------------
          python -m pip cache purge || true

          # --------------------------------------------------------
          # 清理 Playwright / Chromium cache
          # --------------------------------------------------------
          rm -rf ~/.cache/ms-playwright
          rm -rf ~/.cache/pip

          # --------------------------------------------------------
          # 清理目前工作目錄可能殘留的下載檔
          # --------------------------------------------------------
          rm -rf downloads
          rm -f *.apk
          rm -f *.tmp
          rm -f *.part
          rm -f *.crdownload

          # --------------------------------------------------------
          # 釋放 filesystem buffers
          # --------------------------------------------------------
          sync

          echo ""
          echo "📊 清理後記憶體："
          free -h

          echo ""
          echo "📊 清理後磁碟："
          df -h

          echo ""
          echo "✅ 系統環境清理完成"

      # ============================================================
      # 4. 安裝 Python 運行庫
      # ============================================================
      - name: 安裝運行庫
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 5. 安裝全新 Chromium
      # ============================================================
      - name: 安裝 Chromium
        run: |
          echo "========================================"
          echo "🌐 安裝全新 Chromium"
          echo "========================================"

          # 確保不使用之前的 Playwright Cache
          rm -rf ~/.cache/ms-playwright

          python -m playwright install --with-deps chromium

      # ============================================================
      # 6. Chromium 檢查
      # ============================================================
      - name: 檢查 Chromium
        run: |
          echo "========================================"
          echo "🔍 Chromium 檢查"
          echo "========================================"

          if [ -d ~/.cache/ms-playwright ]; then
            echo "Chromium Cache："
            du -sh ~/.cache/ms-playwright || true

            echo ""
            echo "Chromium 檔案："
            find ~/.cache/ms-playwright -maxdepth 2 -type d || true
          else
            echo "❌ Chromium 安裝目錄不存在"
            exit 1
          fi

      # ============================================================
      # 7. 執行前再次釋放 Python / 系統資源
      # ============================================================
      - name: 執行前最終清理
        run: |
          echo "========================================"
          echo "🧹 執行前最終清理"
          echo "========================================"

          # Python GC
          python - <<'PY'
          import gc
          collected = gc.collect()
          print(f"Python GC：回收 {collected} 個物件")
          PY

          # filesystem buffers
          sync

          echo ""
          echo "📊 最終記憶體狀態："
          free -h

          echo ""
          echo "📊 最終磁碟狀態："
          df -h

          echo ""
          echo "✅ 已準備開始 APK 同步"

      # ============================================================
      # 8. 執行 APK 同步
      # ============================================================
      - name: 執行下載
        run: |
          echo "========================================"
          echo "🚀 開始執行 APK 同步"
          echo "========================================"

          python -u python/down.py

      # ============================================================
      # 9. 最終清理
      # ============================================================
      - name: 清理殘留 APK
        if: always()
        run: |
          echo "========================================"
          echo "🧹 Workflow 最終清理"
          echo "========================================"

          rm -rf downloads
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.crdownload
          rm -f *.part
          rm -f *.tmp

          # 不保留 Playwright / Chromium Cache
          rm -rf ~/.cache/ms-playwright

          # 不保留 pip cache
          rm -rf ~/.cache/pip

          sync

          echo ""
          echo "📊 最終記憶體："
          free -h

          echo ""
          echo "📊 最終磁碟："
          df -h

          echo ""
          echo "✅ Workflow 清理完成"
