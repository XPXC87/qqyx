name: 腳本自動同步

on:
  workflow_dispatch:

concurrency:
  group: qqyx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: 檢查
        uses: actions/checkout@v6

      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安裝運行庫
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Chromium
        run: |
          echo "========================================"
          echo "🌐 全新安裝 Chromium"
          echo "========================================"

          rm -rf ~/.cache/ms-playwright

          python -m playwright install --with-deps chromium

      - name: 檢查 Chromium
        run: |
          echo "========================================"
          echo "🔍 Chromium 安裝檢查"
          echo "========================================"

          if [ -d ~/.cache/ms-playwright ]; then
            echo "Chromium 目錄："
            du -sh ~/.cache/ms-playwright || true

            echo ""
            echo "Chromium 檔案："
            find ~/.cache/ms-playwright -maxdepth 2 -type d || true
          else
            echo "❌ Chromium 目錄不存在"
            exit 1
          fi

      - name: 執行下載
        run: |
          echo "========================================"
          echo "🚀 開始執行 APK 同步"
          echo "========================================"

          python -u python/down.py

      - name: 清理殘留 APK
        if: always()
        run: |
          echo "========================================"
          echo "🧹 清理 Workflow"
          echo "========================================"

          rm -rf downloads
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.crdownload
          rm -f *.part
          rm -f *.tmp

          # 不保留 Playwright / Chromium Cache
          rm -rf ~/.cache/ms-playwright

          echo "✅ 清理完成"
