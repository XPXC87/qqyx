name: 腳本自動同步

on:
  workflow_dispatch:

concurrency:
  group: qqyx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: 檢查
        uses: actions/checkout@v6


      # ============================================================
      # 2. 初始化 Python + Pip Cache
      # ============================================================
      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/requirements.txt


      # ============================================================
      # 3. 恢復 Chromium Cache
      # ============================================================
      - name: 恢復 Chromium Cache
        id: chromium-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-


      # ============================================================
      # 5. 安裝 Python 運行庫
      # ============================================================
      - name: 安裝運行庫
        run: |
          echo "========================================"
          echo "🐍 安裝 Python 運行庫"
          echo "========================================"
          pip install -r python/requirements.txt


      # ============================================================
      # 6. 安裝 / 檢查 Chromium
      #
      # Playwright 會優先使用已存在的瀏覽器檔案。
      # 如果 Cache 沒有，就下載新的。
      # ============================================================
      - name: 安裝 Chromium
        run: |
          echo "========================================"
          echo "🌐 安裝 / 檢查 Chromium"
          echo "========================================"

          python -m playwright install --with-deps chromium


      # ============================================================
      # 7. 檢查 Chromium
      # ============================================================
      - name: 檢查 Chromium
        run: |
          echo "========================================"
          echo "🔍 Chromium 檢查"
          echo "========================================"

          if [ -d ~/.cache/ms-playwright ]; then
            echo "Chromium Cache："
            du -sh ~/.cache/ms-playwright || true

            echo ""
            echo "Chromium 檔案："
            find ~/.cache/ms-playwright -maxdepth 2 -type d || true
          else
            echo "❌ Chromium Cache 不存在"
            exit 1
          fi


      # ============================================================
      # 8. 保存 Chromium Cache
      # ============================================================
      - name: 保存 Chromium Cache
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}


      # ============================================================
      # 設定 DNS：阿里雲公共 DNS
      # ============================================================
      - name: 設定阿里雲 DNS
        run: |
          echo "========================================"
          echo "🌐 設定 DNS"
          echo "========================================"

          echo "📡 修改前 DNS："
          resolvectl status 2>/dev/null || cat /etc/resolv.conf || true

          sudo resolvectl dns "$(ip route | awk '/default/ {print $5; exit}')" 223.5.5.5 223.6.6.6 || true

          echo ""
          echo "📡 修改後 DNS："
          resolvectl status 2>/dev/null || cat /etc/resolv.conf || true

          echo ""
          echo "🔍 DNS 測試："
          getent hosts dmpdmp.com || true
      # ============================================================
      # 11. 解析 / 驗證 APK URL
      # ============================================================
      - name: 解析 APK URL
        run: |
          echo "========================================"
          echo "🔎 開始解析 APK URL"
          echo "========================================"

          python -u python/parse.py

          echo ""
          echo "📄 解析結果："
          cat apk_url.txt

      # ============================================================
      # 12. 下載 APK + 上傳 R2
      # ============================================================
      - name: 下載 APK
        run: |
          echo "========================================"
          echo "📥 開始下載 APK 並上傳 R2"
          echo "========================================"

          python -u python/download.py


      # ============================================================
      # 13. 失敗時保留診斷資料
      # ============================================================
      - name: 上傳失敗診斷資料
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qqyx-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            debug/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 14. 最終清理
      # ============================================================
      - name: 清理殘留 APK
        if: always()
        run: |
          echo "========================================"
          echo "🧹 Workflow 最終清理"
          echo "========================================"

          rm -rf downloads
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.crdownload
          rm -f *.part
          rm -f *.tmp

          sync

          echo ""
          echo "📊 最終記憶體："
          free -h

          echo ""
          echo "📊 最終磁碟："
          df -h

          echo ""
          echo "✅ Workflow 完成"
