name: 腳本自動同步

on:
  workflow_dispatch:

concurrency:
  group: qqyx-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: 檢查
        uses: actions/checkout@v6

      - name: 初始化 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安裝運行庫
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢復 Chromium Cache
        id: chromium-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: 安裝 Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: 檢查 Chromium
        run: |
          echo "Chromium Cache："
          du -sh ~/.cache/ms-playwright || true

          echo ""
          echo "Chromium 檔案："
          find ~/.cache/ms-playwright -maxdepth 2 -type d || true

      - name: 保存 Chromium Cache
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 執行下載
        run: |
          python python/down.py

      - name: 清理殘留APK
        if: always()
        run: |
          rm -rf downloads
          rm -f "球球英雄脚本.apk"
          rm -f *.apk
          rm -f *.crdownload
          rm -f *.part
