<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六石禮包碼同步工具</title>
    <style>
        :root { --primary: #28a745; --dark: #1a1a1a; --bg: #f0f2f5; --accent: #007bff; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h3 { margin: 0 0 20px; text-align: center; font-size: 22px; color: var(--dark); }
        textarea { 
            width: 100%; height: 180px; padding: 15px; border: 2px solid #eee; border-radius: 12px; 
            box-sizing: border-box; font-size: 16px; font-family: monospace; resize: none;
        }
        button { 
            width: 100%; margin-top: 15px; padding: 16px; background: var(--dark); color: white; 
            border: none; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold;
        }
        button:disabled { background: #ccc; }
        #statusPanel { 
            margin-top: 20px; padding: 15px; border-radius: 12px; text-align: center; 
            font-weight: bold; display: none; line-height: 1.5;
        }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .result-title { margin-top: 25px; font-weight: bold; color: #666; font-size: 14px; display: flex; justify-content: space-between; }
        #previewList { margin-top: 10px; display: grid; gap: 8px; }
        .code-card { 
            background: #fff; padding: 12px 15px; border-radius: 10px; border-left: 5px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;
        }
        .code-text { font-family: monospace; font-weight: bold; }
        .copy-btn { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: bold; }
        .footer { font-size: 11px; color: #bbb; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="box">
        <h3>🚀 禮包碼雲端同步</h3>
        <textarea id="codes" placeholder="請貼入禮包碼 (一行一個)..."></textarea>
        <button id="submitBtn" onclick="submit()">提交並更新紀錄</button>
    </div>

    <div id="statusPanel"></div>

    <div class="result-title">
        <span>目前雲端庫存</span>
        <span id="count">0 組</span>
    </div>
    
    <div id="previewList"></div>

    <p class="footer">系統版本 2.2 | 已連線至 Cloudflare Edge</p>
</div>

<script>
    const CLOUDFLARE_API = 'https://xpxc.qzz.io/api';

    function showStatus(msg, isSuccess) {
        const panel = document.getElementById('statusPanel');
        panel.innerText = msg;
        panel.className = isSuccess ? 'status-success' : 'status-error';
        panel.style.display = 'block';
        setTimeout(() => { panel.style.display = 'none'; }, 8000);
    }

    function updateUI(content) {
        const listContainer = document.getElementById('previewList');
        const countSpan = document.getElementById('count');
        const lines = content.split('\n').map(s => s.trim()).filter(s => s !== "");
        listContainer.innerHTML = '';
        countSpan.innerText = `${lines.length} 組`;
        lines.forEach(code => {
            const div = document.createElement('div');
            div.className = 'code-card';
            div.innerHTML = `<span class="code-text">${code}</span><span class="copy-btn" onclick="copyToClipboard('${code}')">複製</span>`;
            listContainer.appendChild(div);
        });
    }

    async function copyToClipboard(text) {
        await navigator.clipboard.writeText(text);
        showStatus('已複製: ' + text, true);
    }

    window.onload = async function() {
        try {
            const res = await fetch(CLOUDFLARE_API);
            if (res.ok) {
                const data = await res.json();
                const text = data.join('\n');
                document.getElementById('codes').value = text;
                updateUI(text);
            }
        } catch (e) { console.log("載入失敗"); }
    };

    async function submit() {
        const textarea = document.getElementById('codes');
        const btn = document.getElementById('submitBtn');
        const content = textarea.value.trim();
        if (!content) return showStatus("❌ 請輸入內容", false);

        btn.disabled = true;
        btn.innerText = "提交中...";

        try {
            const response = await fetch(CLOUDFLARE_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: content })
            });
            const result = await response.json();
            if (response.ok && result.success) {
                updateUI(content);
                // 顯示後端 API 實際的回傳訊息
                showStatus(`✅ 成功！回應：${result.backendMsg}`, true);
            } else {
                showStatus(`❌ 失敗：${result.error || '同步出錯'}`, false);
            }
        } catch (error) {
            showStatus("⚠️ 網路錯誤", false);
        } finally {
            btn.disabled = false;
            btn.innerText = "提交並更新紀錄";
        }
    }
</script>
</body>
</html>
