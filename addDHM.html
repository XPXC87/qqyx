<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六石禮包碼同步</title>
    <link rel="stylesheet" href="css/DHM.css">
</head>
<body>

<div class="theme-toggle" onclick="toggleTheme()">
    <span id="theme-icon">🌙</span>
</div>

<div class="container">
    <div class="header">
        <h1><span>⚡</span> 六石禮包碼同步</h1>
        <p>TERMINAL v2.1 // BY XPXC</p>
    </div>

    <div class="main-card">
        <div class="input-header">
            <span>📝 輸入區域</span>
            <span id="line-count">0 行</span>
        </div>
        
        <textarea id="codes" placeholder="請輸入禮包碼，一組一行..." oninput="updateLineCount()"></textarea>

        <div class="action-group">
            <button id="submitBtn" class="btn-primary" onclick="submitData()">🚀 執行同步</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ 清除</button>
        </div>

        <div id="status-box" class="status-box" style="display:none;">
            <div class="status-header">
                <span class="pulse"></span> 系統回傳
            </div>
            <div id="status-content">等待中...</div>
        </div>
    </div>
</div>

<script src="js/DHM.js"></script>
</body>
</html>
