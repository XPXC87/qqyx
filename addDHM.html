<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禮包碼同步終端</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><span>⚡</span> 禮包碼同步終端</h1>
        <p>TERMINAL v4.0 // BY XPXC</p>
    </div>
    <div class="main-card">
        <textarea id="codes" placeholder="請輸入禮包碼，一組一行..." oninput="updateLineCount()"></textarea>
        <div class="action-group">
            <button class="btn-primary" onclick="submitAndOpen()">🚀 同步並跳轉 API</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ 清除</button>
        </div>
        <div id="status-box" class="status-box" style="display:none;">
            <div id="status-content">正在同步雲端資料...</div>
        </div>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
