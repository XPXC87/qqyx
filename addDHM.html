<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六石禮包碼工具</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f7f9; display: flex; justify-content: center; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        h3 { margin-top: 0; text-align: center; }
        textarea { width: 100%; height: 250px; margin: 10px 0; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 18px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; }
        button:active { background: #218838; }
        .footer { font-size: 12px; color: #888; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <h3>禮包碼保存系統</h3>
    <textarea id="codes" placeholder="正在同步雲端紀錄..." inputmode="latin"></textarea>
    <button id="submitBtn" onclick="submit()">提交並更新紀錄</button>
    <p class="footer">※ 資料已與雲端資料庫同步</p>
</div>

<script>
    const CLOUDFLARE_API = 'https://xpxc.qzz.io/api'; 
    const BACKEND_API = 'http://47.96.230.2:9997/qqyxNew/addDHM';

    // 網頁開啟時，自動同步雲端
    window.onload = async function() {
        const textarea = document.getElementById('codes');
        try {
            const response = await fetch(CLOUDFLARE_API);
            if (response.ok) {
                const dbCodes = await response.json();
                if (dbCodes && dbCodes.length > 0) {
                    textarea.value = dbCodes.join('\n');
                }
            }
        } catch (error) {
            textarea.placeholder = "雲端同步失敗：" + error.message;
        }
    };

    async function submit() {
        const textarea = document.getElementById('codes');
        const btn = document.getElementById('submitBtn');
        const content = textarea.value.trim();
        const lines = content.split('\n').map(s => s.trim()).filter(s => s !== "");
        
        if (lines.length === 0) return alert("請輸入禮包碼");

        // 鎖定按鈕避免重複點擊
        btn.disabled = true;
        btn.innerText = "處理中...";
        btn.style.background = "#ccc";

        try {
            // 1. 同步到 Cloudflare D1 (直接存整塊內容)
            await fetch(CLOUDFLARE_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: content })
            });

            // 2. 直接請求後端 API (使用 fetch 替代 window.open)
            const joined = lines.join('@==');
            const targetUrl = `${BACKEND_API}?dhm=${encodeURIComponent(joined)}`;
            
            // 注意：如果後端沒設定 CORS，這步可能會噴錯，但不影響 Cloudflare 存檔
            const res = await fetch(targetUrl, { mode: 'no-cors' }); 
            
            alert("提交成功！");
        } catch (error) {
            alert("提交過程發生錯誤：" + error.message);
        } finally {
            // 恢復按鈕
            btn.disabled = false;
            btn.innerText = "提交並更新紀錄";
            btn.style.background = "#28a745";
        }
    }
</script>
</body>
</html>
